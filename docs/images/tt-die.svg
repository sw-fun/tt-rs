<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 3D Red Die with Question Marks on all visible faces -->

  <defs>
    <linearGradient id="dieTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#FF7070"/>
    </linearGradient>
    <linearGradient id="dieFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF5350"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    <linearGradient id="dieLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#C62828"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="50" cy="88" rx="22" ry="5" fill="rgba(0,0,0,0.2)"/>

  <!-- Cube faces -->
  <!-- Left face -->
  <path d="M15,38 L15,68 L38,82 L38,52 Z" fill="url(#dieLeft)" stroke="#6B0000" stroke-width="1.5"/>
  <!-- Front face -->
  <path d="M38,52 L38,82 L82,62 L82,32 Z" fill="url(#dieFront)" stroke="#6B0000" stroke-width="1.5"/>
  <!-- Top face -->
  <path d="M15,38 L38,52 L82,32 L59,18 Z" fill="url(#dieTop)" stroke="#6B0000" stroke-width="1.5"/>

  <!-- Left face: 5 yellow question marks (like 5 pip pattern) -->
  <text x="22" y="50" font-family="Arial Black, sans-serif" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">?</text>
  <text x="32" y="58" font-family="Arial Black, sans-serif" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">?</text>
  <text x="22" y="66" font-family="Arial Black, sans-serif" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">?</text>
  <text x="32" y="74" font-family="Arial Black, sans-serif" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">?</text>
  <text x="27" y="62" font-family="Arial Black, sans-serif" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">?</text>

  <!-- Front face: one large black question mark -->
  <text x="60" y="62" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" fill="#2D2D2D" text-anchor="middle">?</text>

  <!-- Top face: 6 black question marks (like 6 pip pattern, 2 columns of 3) -->
  <!-- Left column (going down-right due to perspective) -->
  <text x="28" y="38" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 28, 38)">?</text>
  <text x="33" y="44" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 33, 44)">?</text>
  <text x="38" y="50" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 38, 50)">?</text>
  <!-- Right column -->
  <text x="50" y="30" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 50, 30)">?</text>
  <text x="55" y="36" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 55, 36)">?</text>
  <text x="60" y="42" font-family="Arial Black, sans-serif" font-size="7" font-weight="bold" fill="#2D2D2D" text-anchor="middle" transform="rotate(-15, 60, 42)">?</text>
</svg>
